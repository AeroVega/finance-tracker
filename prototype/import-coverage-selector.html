<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Import coverage — synthetic demo</title><link rel="stylesheet" href="../components/import-coverage-selector.css"><style>:root{color-scheme:dark;--text:#f4f5f7;--muted:#a9afbd;--surface:#17191f;--raised:#20232b;--border:#343844;--input:#101217;--accent:#174f66;--accent-strong:#46b8df;--focus:#67c8ed;--warning:#f3c17a;--hover:#303542}*{box-sizing:border-box}body{margin:0;padding:clamp(12px,3vw,28px);background:#0e1015;color:var(--text);font:16px/1.45 system-ui,sans-serif}main{max-width:1080px;margin:auto}#result{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px}</style></head>
<body><main><h1>Declared import coverage — synthetic demo</h1><p>Invented dates and row references only. No upload, persistence, or production workflow.</p><div id="selector"></div><pre id="result" aria-live="polite">No declaration accepted.</pre></main>
<script type="module">
import {mountImportCoverageSelector} from "../components/import-coverage-selector.mjs";
const result=document.querySelector("#result");
const instance=mountImportCoverageSelector({container:document.querySelector("#selector"),contextKey:"invented-file-001",observedDates:[{date:"2024-02-01",rowReference:2},{date:"2024-02-14",rowReference:3},{date:"2024-02-29",rowReference:4},{date:"2024-03-02",rowReference:5}],sourceCoverage:{start:"2024-02-01",end:"2024-02-29",provider:"invented metadata"},onConfirm:coverage=>{result.textContent=JSON.stringify({accepted:true,coverage},null,2);},onCancel:outcome=>{result.textContent=JSON.stringify(outcome,null,2);}});

</script></body></html>
