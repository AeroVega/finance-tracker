name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Stamp deployed source commit
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          cat > js/build-info.js <<EOF
          (() => {
            "use strict";
            const sourceCommit = "$source_sha";
            const target = document.getElementById("build-sha");
            if (target) {
              target.textContent = sourceCommit;
              target.title = "Source commit: " + sourceCommit;
            }
          })();
          EOF
          echo "Deploying source commit: $source_sha"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
