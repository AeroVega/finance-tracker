name: Node contract tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/durable-drive-transaction-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check browser module syntax
        run: |
          node --check js/app.js
          node --check js/dashboard-synthetic-storage.mjs
          node --check js/provider-csv.mjs
          node --check js/canonical-import.mjs
          node --check js/canonical-ledger-storage.mjs
          node --check js/synthetic-application-structure.mjs
          node --check prototype/application-storage-lifecycle-test.mjs
          node --check prototype/pr25-acceptance.mjs
          node --check js/workspace-pages.mjs
          node --check js/workspace-chrome.mjs
          node --check js/canonical-workspace.mjs
          node --check js/canonical-workspace-model.mjs
          node --check js/canonical-workspace-session.mjs
          node --check js/financial-position-contract.mjs
          node --check js/financial-position.mjs
          node --check js/synthetic-financial-position.mjs
          node --check js/synthetic-financial-year.mjs
          node --check js/synthetic-year-seeder.mjs
          node --check prototype/synthetic-year.mjs
          node --check prototype/pr28-import.mjs
          node --check prototype/acceptance.mjs
          node --check prototype/acceptance-plan.mjs
          node --check prototype/pr28-testing.mjs
          node --check prototype/pr28-testing-plan.mjs
          node --check prototype/pr28-testing-checks.mjs
          node --check prototype/pr28-live-checks.mjs
      - name: Check documentation links and current-state contracts
        run: node scripts/check-docs.mjs
      - name: Run complete Node suite including extended storage growth
        # Dense synthetic storage regressions must not compete for heap across files.
        # Local runs use representative growth fixtures; CI retains every scale.
        env:
          FINANCE_EXTENDED_STORAGE_TESTS: "1"
        run: node --max-old-space-size=768 --test --test-concurrency=1 tests/*.test.mjs

  # Preserve the former required-check name without running the suite twice.
  transaction-contracts:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete suite to pass
        env:
          SUITE_RESULT: ${{ needs.test.result }}
        run: test "$SUITE_RESULT" = success
