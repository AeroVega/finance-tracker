name: Node contract tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check browser module syntax
        run: |
          node --check prototype/pr28-import.mjs
          node --check prototype/pr28-testing.mjs
          node --check prototype/pr28-testing-plan.mjs
          node --check prototype/pr28-testing-checks.mjs
          node --check prototype/pr28-live-checks.mjs
      - name: Run complete Node test suite
        run: node --test tests/*.test.mjs
