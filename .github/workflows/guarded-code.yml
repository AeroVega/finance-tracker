name: Guarded code

# No path filter: the required check must be reported even on unrelated PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  guarded-code:
    name: Guarded code checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed merge revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false
      - name: Classify changes and run selected suites
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          file=scripts/check-guarded-code.mjs
          checker="$(mktemp "$RUNNER_TEMP/guarded-code.XXXXXX.mjs")"
          if git cat-file -e "$BASE_SHA:$file" 2>/dev/null; then
            git show "$BASE_SHA:$file" > "$checker"
          else
            git show "$HEAD_SHA:$file" > "$checker"
          fi
          FINANCE_EXTENDED_STORAGE_TESTS=1 node "$checker" "$BASE_SHA" "$HEAD_SHA" --run
