name: Finance Tracker contract tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/durable-drive-transaction-engine]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check browser and dashboard module syntax
        run: node --check js/app.js && node --check js/dashboard-synthetic-storage.mjs && node --check prototype/application-storage-lifecycle-test.mjs && node --check prototype/pr25-acceptance.mjs
      - name: Run complete Node contract suite
        run: node --test tests/*.test.mjs
